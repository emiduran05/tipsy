<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://kit.fontawesome.com/dd1616d30f.js" crossorigin="anonymous"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Anton+SC&family=Carter+One&family=Chewy&family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Creepster&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Pixelify+Sans:wght@400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>Tipsy</title>
</head>

<body>
    <header class="header">
        <i class="fa-solid fa-bars"></i>
        <h1>Tipsy</h1>
    </header>

    <main class="main_event">
        <section class="event-display">
            <div class="event-display-container">
                <img src="media/cups.jpg" alt="Picture of a party">

                <div class="container-text">
                    <h1>Andre's Birthday</h1>
                    <h2>Andre is getting older. Again.</h2>
                </div>

            </div>

            <div class="event-info">
                <time datetime="2026-12-18">Sat, 27 Sep 2026, 10PM</time>
                <p> <i class="fa-solid fa-user"></i> 10 users</p>
            </div>

        </section>


        <section class="poll-showcase">
            
                    <h3>What time will Anre lose track of his phone?</h3>
                    <ul>
                        <li>before midnight</li>
                        <li>after midnight</li>
                        <li>Never - new year, new Andre?</li>
                    </ul>
                    <div class="extra-info">
                        <p>4 users have voted</p>
                        <p>Status: <strong>open</strong></p>
                    </div>
                    

            <!-- HIDDEN, opened by button -->
            <div id="create-poll-popup" popover>
                <button type="button" popovertarget="create-poll-popup" popovertargetaction="hide">Cancel</button>
                <h1>Create your Tipsy event</h1>

                <form action="events.html" method="get">
                    <label for="poll-name">Name</label>
                    <input id="poll-name" name="name" type="text" required>

                    <label for="poll-type">Type of question</label>
                    <input id="poll-type" name="type" type="radio" required>

                    <label for="poll-option">Option 1</label>
                    <input id="poll-option" name="option" type="text" required>

                    <label for="poll-option">Option 2</label>
                    <input id="poll-option" name="option" type="text" required>

                    <button type="submit">Create Question</button>
                </form>
            </div>
        </section>

                    <button type="button" class="createq-btn" popovertarget="create-poll-popup">+ Create Question</button>

    </main>

    <footer class="footer">
        <p>© 2026 Tipsy</p>
    </footer>
</body>

</html>
