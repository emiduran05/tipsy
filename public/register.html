<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://kit.fontawesome.com/dd1616d30f.js" crossorigin="anonymous"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Anton+SC&family=Carter+One&family=Chewy&family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Creepster&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Pixelify+Sans:wght@400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>Tipsy</title>
</head>

<body>
    <header class="header">
        <i class="fa-solid fa-bars"></i>
        <h1>Tipsy</h1>
    </header>


    <main class="register_main">

        <div class="register_main_intro">
            <div class="box1"><p>Who will arrive late?</p></div>
            <div class="box2"><p>Who will leave first?</p></div>
            <div class="box3"><p>Who’s taking the  most shots?</p></div>

        </div>


        <div class="register_main_register">



        <h2>Create your Tipsy Account</h2>
        <h3>Join Tipsy and start making your predictions.</h2>
            <div class="form_container">
                <form action="user-page.html" class="register_form">

                    <label for="firstname">first name</label>
                    <input id="firstname" name="firstname" type="firstname" required placeholder="Max">

                    <label for="lastname">last name</label>
                    <input id="lastname" name="lastname" type="lastname" required placeholder="Mustermann">

                    <label for="username">username</label>
                    <input id="username" name="username" type="username" required placeholder="exampleName">

                    <label for="email">email</label>
                    <input id="email" name="username" type="email" required placeholder="example@mail.com">

                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" required>

                    <button type="submit">Register</button>
                    
                </form>
                <div class="login_option">
                    <p>Already have an account? </p>
                    <a href="index.html">Log in</a>
                </div>
                
            </div>
        </div>
        

            
    </main>

    <footer class="footer">
        <p>© 2026 Tipsy</p>
    </footer>
</body>

</html>
