<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipsy</title>
    <link rel="stylesheet" media="all" href="css/style.css">
</head>

<body>
    <header>
        <h1>Tipsy</h1>
    </header>
    <main>
        <h1>Create your Tipsy Account</h1>
        <h2>Join Tipsy and start making your predictions.</h2>
        <form action="user-page.html" method="get">

            <label for="firstname">first name</label>
            <input id="firstname" name="firstname" type="firstname" required placeholder="Max">

            <label for="lastname">last name</label>
            <input id="lastname" name="lastname" type="lastname" required placeholder="Mustermann">

            <label for="username">username</label>
            <input id="username" name="username" type="username" required placeholder="exampleName">

            <label for="email">email</label>
            <input id="email" name="username" type="email" required placeholder="example@mail.com">

            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>

            <button type="submit">Register</button>
            <p>Already have an account? <a href="index.html">Log in</a></p>
        </form>
        <footer>
            <p>© 2026 Tipsy</p>
        </footer>
    </main>
</body>

</html>
